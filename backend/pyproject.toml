[project]
name = "motivation-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.5.2",
  "supabase>=2.10.0",
  "openai>=1.58.1",
  "httpx>=0.28.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
